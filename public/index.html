  };

  // ==================== ICONES ====================
  var iconCache = {};
  function testarIconeDisponivel(src,cb){if(iconCache.hasOwnProperty(src)){cb(iconCache[src]);return}var img=new Image();img.onload=function(){iconCache[src]=true;cb(true)};img.onerror=function(){iconCache[src]=false;cb(false)};img.src=src}
  function preTestarTodosIcones(){Object.keys(PROMO_CONFIG).forEach(function(tipo){testarIconeDisponivel(PROMO_CONFIG[tipo].icon,function(){})})}
  function gerarHTMLIcone(tipo,tamanho){var config=PROMO_CONFIG[tipo]||PROMO_CONFIG['desconto'];var sizeClass=tamanho==='grande'?'alert-icon-img':'promo-icon-img';var faClass='fa-fallback';if(iconCache[config.icon]===true)return'<img class="'+sizeClass+'" src="'+config.icon+'" alt="'+config.label+'"><i class="'+config.faIcon+' '+faClass+'" style="display:none;"></i>';if(iconCache[config.icon]===false)return'<i class="'+config.faIcon+' '+faClass+'"></i>';return'<img class="'+sizeClass+'" src="'+config.icon+'" alt="'+config.label+'" onerror="this.classList.add(\'img-failed\');this.style.display=\'none\';var fa=this.nextElementSibling;if(fa)fa.style.display=\'\';" onload="var fa=this.nextElementSibling;if(fa)fa.style.display=\'none\';"><i class="'+config.faIcon+' '+faClass+'"></i>'}

  // ==================== DADOS MOCK (fallback) ====================
  var MOCK_PROMOS = [
    {id:1,tipo:'flash',titulo:'Galaxy S24 FE 128GB',desc:'Flash Sale: 50% OFF por 2 horas apenas!',loja:'TechStore',precoOld:3499,precoNew:1749,tempoRestante:7200},
    {id:2,tipo:'cupom',titulo:'Fone Bluetooth Sony WH-1000XM5',desc:'Use o cupom RADAR10 e ganhe 10% OFF',loja:'SomMax',precoOld:2299,precoNew:2069,cupom:'RADAR10'},
    {id:3,tipo:'frete_gratis',titulo:'Kit Organizacao Closet 5 pecas',desc:'Frete Grátis em compras acima de R$ 99',loja:'Casa&Estrutura',precoOld:189,precoNew:149},
    {id:4,tipo:'cashback',titulo:'Perfume Tom Ford Tobacco Vanille 50ml',desc:'10% de Cashback na sua carteira digital',loja:'BelezaVIP',precoOld:1450,precoNew:1299},
    {id:5,tipo:'leve_pague',titulo:'Camiseta Polo Classic',desc:'Compre 2, Leve 3 — Pague 2!',loja:'ModaFit',precoOld:89,precoNew:59},
    {id:6,tipo:'blackfriday',titulo:'MacBook Air M3 256GB',desc:'Black Friday: Maiores descontos do ano!',loja:'AppleZone',precoOld:12499,precoNew:9999},
    {id:7,tipo:'saldao',titulo:'Jaqueta de Couro Legítimo',desc:'Saldão de Inverno — ate 70% OFF',loja:'Couro&Style',precoOld:899,precoNew:269},
    {id:8,tipo:'outlet',titulo:'Tenis Nike Air Max 90',desc:'Outlet de Fabrica — pecas de colecao passada',loja:'SneakerOutlet',precoOld:749,precoNew:349},
    {id:9,tipo:'brinde',titulo:'Skincare Coreano Set 7 Steps',desc:'Ganhe um brinde exclusivo na compra acima de R$ 150',loja:'KBeauty',precoOld:280,precoNew:199},
    {id:10,tipo:'progressivo',titulo:'Vinho Malbec Argentino',desc:'Compre 2 = 10% OFF | 3 = 20% OFF | 4 = 30% OFF',loja:'VinhoPremium',precoOld:89,precoNew:62},
    {id:11,tipo:'primeira',titulo:'Kindle Paperwhite 11a Geracao',desc:'20% OFF na sua primeira compra!',loja:'LivrariaDigital',precoOld:649,precoNew:519},
    {id:12,tipo:'live',titulo:'Make Set Profissional 24 pecas',desc:'AO VIVO agora: Ofertas exclusivas na live!',loja:'GlamLive',precoOld:450,precoNew:189},
    {id:13,tipo:'combo',titulo:'Kit Gamer: Mouse + Teclado + Mousepad',desc:'Kit Completo: 3 produtos por R$ 199',loja:'GameZone',precoOld:349,precoNew:199},
    {id:14,tipo:'parcela',titulo:'TV LG OLED 55" C4',desc:'12x sem juros em todos os produtos!',loja:'TVWorld',precoOld:6999,precoNew:5499},
    {id:15,tipo:'misterio',titulo:'Caixa Misteriosa Premium',desc:'Caixa Misteriosa por R$ 49 — Valor garantido de R$ 150!',loja:'SurpriseBox',precoOld:150,precoNew:49}
  ];

  var MOCK_PRICE_HISTORY = {};
  MOCK_PROMOS.forEach(function(p){if(p.precoNew>0){var bars=[];for(var i=0;i<12;i++){var v=p.precoOld+(p.precoNew-p.precoOld)*(i/11)+(Math.random()-0.5)*(p.precoOld-p.precoNew)*0.3;bars.push(Math.max(p.precoNew*0.9,Math.min(p.precoOld*1.1,v)))}bars[11]=p.precoNew;MOCK_PRICE_HISTORY[p.id]=bars}});

  // ==================== ESTADO ====================
  var sidebarAberta=true,searchActive=false,alertasAtivados=true,alertTimeout=null,tabAtiva='feed',filtroAtivo=null;
  var monitoredProducts=[],savingsTotal=0,demoInterval=null,flashTimers={};
  var neonOnline=false,promocoesNeon=[],autoRefreshInterval=null;

  function ajustarBrilho(hex,percent){var num=parseInt(hex.replace('#',''),16);var amt=Math.round(2.55*percent);var R=(num>>16)+amt;var G=(num>>8&0x00FF)+amt;var B=(num&0x0000FF)+amt;return'#'+(0x1000000+(R<255?R<1?0:R:255)*0x10000+(G<255?G<1?0:G:255)*0x100+(B<255?B<1?0:B:255)).toString(16).slice(1)}

  // ===================================================================
  // BUSCAR PROMOCOES DO NEON VIA API /programas
  // ===================================================================
  async function buscarPromocoesNeon(){
    try{
      var url='/programas?limite=50';
      if(filtroAtivo)url+='&setor='+encodeURIComponent(filtroAtivo);
      var response=await fetch(url);
      if(!response.ok)throw new Error('API /programas indisponivel');
      var data=await response.json();
      if(data.programas&&data.programas.length>0){
        neonOnline=true;
        document.getElementById('status-dot').classList.remove('offline');
        return data.programas.map(function(p){
          return{
            id:p.awin_id||p.id,
            tipo:mappearSetorParaTipo(p.setor),
            titulo:p.nome||'Produto',
            desc:p.descricao||'Oferta da Awin',
            loja:p.nome||'Awin',
            precoOld:0,
            precoNew:0,
            cupom:null,
            tempoRestante:0,
            fonte:'Awin'
          };
        });
      }
      return null;
    }catch(err){
      console.warn('Erro ao buscar do Neon:',err);
      neonOnline=false;
      document.getElementById('status-dot').classList.add('offline');
      return null;
    }
  }

  // Mapear setor da Awin para tipo de promoção
  function mappearSetorParaTipo(setor){
    if(!setor)return 'desconto';
    var s=setor.toLowerCase();
    if(s.indexOf('eletronic')!==-1||s.indexOf('tech')!==-1)return 'flash';
    if(s.indexOf('moda')!==-1||s.indexOf('vestuario')!==-1)return 'saldao';
    if(s.indexOf('casa')!==-1||s.indexOf('decor')!==-1)return 'outlet';
    if(s.indexOf('beleza')!==-1||s.indexOf('saude')!==-1)return 'cashback';
    if(s.indexOf('games')!==-1)return 'combo';
    if(s.indexOf('livros')!==-1)return 'leve_pague';
    if(s.indexOf('esporte')!==-1)return 'frete_gratis';
    return 'desconto';
  }

  // ===================================================================
  // BUSCAR TRANSACOES DO NEON VIA API /transacoes
  // ===================================================================
  async function buscarTransacoesNeon(){
    try{
      var response=await fetch('/transacoes?limite=10');
      if(!response.ok)throw new Error('API /transacoes indisponivel');
      var data=await response.json();
      return data.transacoes||[];
    }catch(err){
      console.warn('Erro ao buscar transacoes:',err);
      return [];
    }
  }

  // ===================================================================
  // ALERTA
  // ===================================================================
  function dispararAlertaPromocaoIA(mensagem,tipoPromo){
    if(!alertasAtivados)return;
    var bar=document.getElementById('alert-bar');bar.classList.remove('alert-bar-critico');bar.style.background='';bar.style.color='';bar.style.borderTopColor='';
    var config=PROMO_CONFIG[tipoPromo]||PROMO_CONFIG['desconto'];
    document.getElementById('alert-title').textContent=config.emoji+' '+config.label+'!';
    document.getElementById('alert-text').textContent=mensagem;
    var iconBox=document.getElementById('alert-icon-box');
    iconBox.style.background='linear-gradient(135deg,'+config.color+','+ajustarBrilho(config.color,-25)+')';
    iconBox.innerHTML=gerarHTMLIcone(tipoPromo,'grande');
    var bgColor=config.color;
    if(config.urgent||tipoPromo==='blackfriday')bar.classList.add('alert-bar-critico');
    if(tipoPromo==='flash'){bar.style.background='linear-gradient(90deg,'+bgColor+','+ajustarBrilho(bgColor,-20)+')';bar.style.color='#000'}
    else if(tipoPromo==='blackfriday'){bar.style.background='linear-gradient(90deg,#212121,#111)';bar.style.borderTopColor='#FFD700';bar.style.color='#FFD700'}
    else if(tipoPromo==='bilhete'){bar.style.background='linear-gradient(90deg,#1a1a2e,#16213e)';bar.style.borderTopColor='#FFD700';bar.style.color='#FFD700'}
    else{bar.style.background='linear-gradient(90deg,'+bgColor+','+ajustarBrilho(bgColor,-20)+')';bar.style.color='#fff'}
    var container=document.getElementById('alert-container');
    if(container.style.display!=='block'){container.style.display='block';container.style.animation='none';container.offsetHeight;container.style.animation='slideUp 0.35s ease-out'}
    try{var sound=document.getElementById('alert-sound');if(sound&&sound.src){sound.currentTime=0;sound.play().catch(function(){})}}catch(e){}
    clearTimeout(alertTimeout);alertTimeout=setTimeout(function(){esconderAlertaVisual()},6000);
    savingsTotal+=Math.floor(Math.random()*80)+20;document.getElementById('savings-total').textContent='R$ '+savingsTotal.toLocaleString('pt-BR');
  }
  function esconderAlertaVisual(){document.getElementById('alert-container').style.display='none';var bar=document.getElementById('alert-bar');bar.classList.remove('alert-bar-critico');bar.style.color='';bar.style.borderTopColor=''}

  var toastTimer=null;
  function showNotification(msg){var toast=document.getElementById('toast-msg');toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},2800)}

  function formatarTempo(seg){var h=Math.floor(seg/3600);var m=Math.floor((seg%3600)/60);var s=seg%60;if(h>0)return h+'h '+String(m).padStart(2,'0')+'m';if(m>0)return m+'m '+String(s).padStart(2,'0')+'s';return s+'s'}
  function iniciarTimer(promoId,segundos){var remaining=segundos;clearInterval(flashTimers[promoId]);flashTimers[promoId]=setInterval(function(){remaining--;var el=document.getElementById('timer-'+promoId);if(!el){clearInterval(flashTimers[promoId]);return}if(remaining<=0){el.querySelector('.timer-value').textContent='Encerrado';el.classList.add('urgent');clearInterval(flashTimers[promoId]);return}el.querySelector('.timer-value').textContent=formatarTempo(remaining);if(remaining<600)el.classList.add('urgent')},1000)}

  // ===================================================================
  // RENDERIZAR CARDS
  // ===================================================================
  async function renderFeed(promos){
    var container=document.getElementById('feed-container');container.innerHTML='';
    var lista=promos;
    if(!lista){var neonData=await buscarPromocoesNeon();lista=neonData||MOCK_PROMOS}
    if(filtroAtivo)lista=lista.filter(function(p){return p.tipo===filtroAtivo});
    var q=document.getElementById('search-query').value.trim().toLowerCase();
    if(q.length>=2)lista=lista.filter(function(p){return p.titulo.toLowerCase().indexOf(q)!==-1||p.desc.toLowerCase().indexOf(q)!==-1||p.loja.toLowerCase().indexOf(q)!==-1||(PROMO_CONFIG[p.tipo]&&PROMO_CONFIG[p.tipo].label.toLowerCase().indexOf(q)!==-1)});
    if(lista.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-search"></i><p>Nenhuma oferta encontrada.</p></div>';return}
    lista.forEach(function(promo,idx){
      var config=PROMO_CONFIG[promo.tipo]||PROMO_CONFIG['desconto'];
      var card=document.createElement('div');card.className='promo-card';card.style.animationDelay=(idx*0.06)+'s';
      var isUrgent=config.urgent,isLive=config.isLive,hasTimer=promo.tempoRestante>0;
      var priceOldStr=promo.precoOld>0?'R$ '+promo.precoOld.toLocaleString('pt-BR'):'';
      var priceNewStr=promo.precoNew>0?'R$ '+promo.precoNew.toLocaleString('pt-BR'):'';
      var pctDesc='';if(promo.precoOld>0&&promo.precoNew>0){var pct=Math.round((1-promo.precoNew/promo.precoOld)*100);if(pct>0)pctDesc='-'+pct+'%'}
      var histHTML='';var hist=MOCK_PRICE_HISTORY[promo.id];
      if(hist&&hist.length>0){var maxH=Math.max.apply(null,hist);var minH=Math.min.apply(null,hist);histHTML='<div class="price-history-mini">';hist.forEach(function(v){var h=3+((v-minH)/(maxH-minH+1))*27;var c=v===hist[hist.length-1]?'#4CAF50':'rgba(255,255,255,0.15)';histHTML+='<div class="price-bar" style="height:'+h+'px;background:'+c+';"></div>'});histHTML+='</div>'}
      var timerHTML='';if(hasTimer)timerHTML='<div class="promo-timer urgent" id="timer-'+promo.id+'"><i class="fas fa-clock"></i> <span class="timer-value">'+formatarTempo(promo.tempoRestante)+'</span></div>';
      var btnColor=config.goldAccent||config.color;var btnText='Aproveitar';if(promo.cupom)btnText='Cupom: '+promo.cupom;if(isLive)btnText='Assistir Live';
      var liveHTML=isLive?'<div class="live-indicator"><div class="live-dot"></div> AO VIVO</div>':'';
      var sourceHTML=promo.fonte?'<span class="source-badge" style="background:rgba(255,255,255,0.05);color:var(--text-muted);"><i class="fas fa-rss" style="font-size:0.5rem;"></i> '+promo.fonte+'</span>':'';
      var iconHTML=gerarHTMLIcone(promo.tipo,'pequeno');
      card.innerHTML='<div class="promo-card-accent" style="background:linear-gradient(90deg,'+config.color+','+ajustarBrilho(config.color,-20)+');"></div><div class="promo-card-body"><div class="promo-card-icon" style="background:linear-gradient(135deg,'+config.color+','+ajustarBrilho(config.color,-30)+');">'+iconHTML+(isUrgent?'<div class="pulse-ring"></div>':'')+'</div><div class="promo-card-content"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span class="promo-card-type" style="background:'+ajustarBrilho(config.color,-60)+';color:'+config.color+';">'+config.label+'</span>'+(pctDesc?'<span style="font-size:0.72rem;font-weight:800;color:#4CAF50;">'+pctDesc+'</span>':'')+liveHTML+sourceHTML+'</div><div class="promo-card-title">'+promo.titulo+'</div><div class="promo-card-desc">'+promo.desc+'</div><div class="promo-card-meta">'+(priceOldStr?'<span class="promo-price-old">'+priceOldStr+'</span>':'')+'<span class="promo-price-new" style="color:'+(promo.precoNew<promo.precoOld?'#4CAF50':'var(--text-main)')+';">'+priceNewStr+'</span><span class="promo-store"><i class="fas fa-store"></i> '+promo.loja+'</span></div>'+histHTML+'</div></div><div class="promo-card-footer">'+timerHTML+'<button class="promo-btn-grab" style="background:linear-gradient(135deg,'+btnColor+','+ajustarBrilho(btnColor,-15)+');">'+btnText+'</button></div>';
      container.appendChild(card);
      if(hasTimer)iniciarTimer(promo.id,promo.tempoRestante);
    });
  }

  function renderMonitored(){var container=document.getElementById('feed-container');container.innerHTML='';if(monitoredProducts.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-eye-slash"></i><p>Nenhum produto monitorado.<br>Toque no botao + para adicionar.</p></div>';return}monitoredProducts.forEach(function(prod,idx){var card=document.createElement('div');card.className='monitored-card';card.style.animationDelay=(idx*0.06)+'s';var statusColor='#4CAF50';if(prod.currentPrice>prod.targetPrice*1.1)statusColor='#ff4444';else if(prod.currentPrice>prod.targetPrice)statusColor='#FFB300';card.innerHTML='<div class="prod-img" style="color:'+statusColor+';"><i class="fas fa-box"></i></div><div class="prod-info"><div class="prod-name">'+prod.name+'</div><div class="prod-target">Alvo: R$ '+prod.targetPrice.toLocaleString('pt-BR')+'</div></div><div class="prod-current" style="color:'+statusColor+';">R$ '+prod.currentPrice.toLocaleString('pt-BR')+'</div><button class="remove-btn" data-idx="'+idx+'" title="Remover"><i class="fas fa-trash"></i></button>';container.appendChild(card);card.querySelector('.remove-btn').addEventListener('click',function(){monitoredProducts.splice(parseInt(this.getAttribute('data-idx')),1);renderMonitored();atualizarBadgeMonitorados();showNotification('Produto removido')})})}

  function renderHistory(){var container=document.getElementById('feed-container');container.innerHTML='';var promosComHist=MOCK_PROMOS.filter(function(p){return MOCK_PRICE_HISTORY[p.id]});if(promosComHist.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-chart-line"></i><p>Nenhum historico.</p></div>';return}promosComHist.forEach(function(promo,idx){var config=PROMO_CONFIG[promo.tipo]||PROMO_CONFIG['desconto'];var hist=MOCK_PRICE_HISTORY[promo.id];var maxH=Math.max.apply(null,hist);var minH=Math.min.apply(null,hist);var card=document.createElement('div');card.className='promo-card';card.style.animationDelay=(idx*0.06)+'s';var meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];var barsHTML='<div style="display:flex;align-items:flex-end;gap:4px;height:80px;padding:10px 0;">';hist.forEach(function(v,i){var h=8+((v-minH)/(maxH-minH+1))*65;var c=i===hist.length-1?'#4CAF50':'rgba(255,179,0,0.3)';barsHTML+='<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:2px;"><div style="width:100%;height:'+h+'px;background:'+c+';border-radius:3px 3px 0 0;min-height:4px;"></div><span style="font-size:0.5rem;color:var(--text-muted);">'+meses[i]+'</span></div>'});barsHTML+='</div>';card.innerHTML='<div class="promo-card-accent" style="background:linear-gradient(90deg,'+config.color+','+ajustarBrilho(config.color,-20)+');"></div><div style="padding:14px 16px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span class="promo-card-type" style="background:'+ajustarBrilho(config.color,-60)+';color:'+config.color+';">'+config.label+'</span><span style="font-weight:700;font-size:0.9rem;">'+promo.titulo+'</span></div><div style="display:flex;gap:16px;font-size:0.8rem;margin-bottom:4px;"><span style="color:var(--text-muted);">Maior: R$ '+maxH.toLocaleString('pt-BR')+'</span><span style="color:#4CAF50;">Menor: R$ '+minH.toLocaleString('pt-BR')+'</span></div>'+barsHTML+'</div>';container.appendChild(card)})}

  function renderCompare(){var container=document.getElementById('feed-container');container.innerHTML='';var produtosComComp=Object.keys(MOCK_COMPARE||{});if(produtosComComp.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-balance-scale"></i><p>Nenhum produto para comparar.</p></div>';return}produtosComComp.forEach(function(nome,idx){var lojas=MOCK_COMPARE[nome].slice().sort(function(a,b){return a.preco-b.preco});var melhor=lojas[0].preco;var card=document.createElement('div');card.className='promo-card';card.style.animationDelay=(idx*0.06)+'s';var rowsHTML='';lojas.forEach(function(l){var isBest=l.preco===melhor;rowsHTML+='<div class="compare-row"><span class="compare-store"><i class="fas fa-store" style="margin-right:6px;color:'+(isBest?'#4CAF50':'var(--text-muted)')+';"></i>'+l.loja+(isBest?' <span style="font-size:0.65rem;font-weight:800;color:#4CAF50;">MELHOR PRECO</span>':'')+'</span><span class="compare-price '+(isBest?'compare-best':'')+'">R$ '+l.preco.toLocaleString('pt-BR')+'</span></div>'});card.innerHTML='<div class="promo-card-accent" style="background:linear-gradient(90deg,#4CAF50,#2E7D32);"></div><div style="padding:14px 16px;"><div style="font-weight:700;font-size:0.95rem;margin-bottom:12px;"><i class="fas fa-balance-scale" style="margin-right:8px;color:#4CAF50;"></i>'+nome+'</div>'+rowsHTML+'</div>';container.appendChild(card)})}

  function renderFilters(){var strip=document.getElementById('filter-strip');strip.innerHTML='';var chipAll=document.createElement('button');chipAll.className='filter-chip'+(!filtroAtivo?' active':'');chipAll.innerHTML='<i class="fas fa-th"></i> Todos';chipAll.addEventListener('click',function(){filtroAtivo=null;renderFilters();renderCurrentTab()});strip.appendChild(chipAll);var tiposFiltro=['flash','cupom','frete_gratis','cashback','leve_pague','blackfriday','saldao','outlet','desconto','brinde','progressivo','combo','parcela','live','misterio','sorteio'];tiposFiltro.forEach(function(tipo){var config=PROMO_CONFIG[tipo];if(!config)return;var chip=document.createElement('button');chip.className='filter-chip'+(filtroAtivo===tipo?' active':'');chip.innerHTML='<span class="chip-dot" style="background:'+config.color+';"></span> '+config.label;chip.addEventListener('click',function(){filtroAtivo=filtroAtivo===tipo?null:tipo;renderFilters();renderCurrentTab()});strip.appendChild(chip)})}

  function abrirComparacao(titulo){var lojas=MOCK_COMPARE[titulo];if(!lojas){showNotification('Comparacao indisponivel');return}document.getElementById('compare-title').textContent=titulo;document.getElementById('compare-subtitle').textContent='Precos em diferentes lojas';var listEl=document.getElementById('compare-list');listEl.innerHTML='';var sorted=lojas.slice().sort(function(a,b){return a.preco-b.preco});var melhor=sorted[0].preco;sorted.forEach(function(l){var isBest=l.preco===melhor;var row=document.createElement('div');row.className='compare-row';row.innerHTML='<span class="compare-store"><i class="fas fa-store" style="margin-right:6px;color:'+(isBest?'#4CAF50':'var(--text-muted)')+';"></i>'+l.loja+(isBest?' <span style="font-size:0.65rem;font-weight:800;color:#4CAF50;">MELHOR</span>':'')+'</span><span class="compare-price '+(isBest?'compare-best':'')+'">R$ '+l.preco.toLocaleString('pt-BR')+'</span>';listEl.appendChild(row)});document.getElementById('modal-compare').classList.add('active')}

  function atualizarBadgeMonitorados(){var badge=document.getElementById('monitored-count');if(monitoredProducts.length>0){badge.textContent=monitoredProducts.length;badge.style.display='flex'}else{badge.style.display='none'}}

  function renderCurrentTab(){switch(tabAtiva){case'feed':renderFeed();break;case'monitored':renderMonitored();break;case'history':renderHistory();break;case'compare':renderCompare();break}}

  var DEMO_MSGS={'desconto':'-30% em todos os produtos!','saldao':'Saldão de Inverno — ate 70% OFF!','outlet':'Outlet de Fabrica!','flash':'Flash Sale: 50% OFF por 2 horas!','frete_gratis':'Frete Grátis em compras acima de R$ 99','cupom':'Use o cupom MAXPROMO20 e ganhe 20% OFF','leve_pague':'Compre 2, Leve 3 — Pague 2!','cashback':'10% de Cashback!','blackfriday':'Black Friday: Maiores descontos!','brinde':'Ganhe um brinde exclusivo!','progressivo':'Compre 2=10% OFF|3=20% OFF|4=30% OFF','primeira':'20% OFF na primeira compra!','fidelidade':'Ganhe pontos duplos!','misterio':'Caixa Misteriosa por R$ 49!','bilhete':'Bilhete Dourado! Premio exclusivo!','live':'AO VIVO agora: Ofertas exclusivas!','combo':'Kit Completo: 3 produtos por R$ 99','parcela':'12x sem juros!','cross':'Leve junto com 20% OFF','sorteio':'Sorteio iPhone 16 Pro!'};
  function dispararAlertaAleatorio(){var tipos=Object.keys(PROMO_CONFIG);var tipo=tipos[Math.floor(Math.random()*tipos.length)];dispararAlertaPromocaoIA(DEMO_MSGS[tipo]||PROMO_CONFIG[tipo].label+' ativado!',tipo)}

  // ==================== INIT ====================
  function initApp(){
    setTimeout(function(){document.getElementById('loading-fullscreen').classList.add('fade-out')},1500);
    preTestarTodosIcones();renderFilters();renderFeed();

    document.getElementById('btn-menu-toggle').addEventListener('click',function(){sidebarAberta=!sidebarAberta;var sidebar=document.getElementById('sidebar-controls');if(sidebarAberta){sidebar.classList.remove('retracted');this.classList.remove('active')}else{sidebar.classList.add('retracted');this.classList.add('active');if(searchActive){searchActive=false;document.getElementById('search-bar').classList.remove('active')}}});

    document.querySelectorAll('.tab-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');b.setAttribute('aria-selected','false')});this.classList.add('active');this.setAttribute('aria-selected','true');tabAtiva=this.getAttribute('data-tab');document.getElementById('fab-add').style.display=(tabAtiva==='feed'||tabAtiva==='monitored')?'flex':'none';renderCurrentTab()})});

    document.getElementById('btn-search-toggle').addEventListener('click',function(){searchActive=!searchActive;var bar=document.getElementById('search-bar');if(searchActive){bar.classList.add('active');setTimeout(function(){document.getElementById('search-query').focus()},300)}else{bar.classList.remove('active');document.getElementById('search-query').value='';renderCurrentTab()}});
    document.getElementById('btn-search').addEventListener('click',function(){renderCurrentTab();showNotification('Busca realizada')});
    document.getElementById('search-query').addEventListener('keypress',function(e){if(e.key==='Enter'){renderCurrentTab();showNotification('Busca realizada')}});
    document.getElementById('search-query').addEventListener('input',function(){if(tabAtiva==='feed')renderFeed()});

    document.getElementById('btn-alert-toggle').addEventListener('click',function(){alertasAtivados=!alertasAtivados;var icon=document.getElementById('alert-toggle-icon');if(alertasAtivados){icon.className='fas fa-bell';this.style.borderColor='';this.style.color='var(--accent-color)';showNotification('Alertas ativados')}else{icon.className='fas fa-bell-slash';this.style.borderColor='#ff4444';this.style.color='#ff4444';showNotification('Alertas desativados')}});
    document.getElementById('alert-close-btn').addEventListener('click',esconderAlertaVisual);

    function ativarFiltroSidebar(tipo){filtroAtivo=filtroAtivo===tipo?null:tipo;tabAtiva='feed';document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});document.querySelector('[data-tab="feed"]').classList.add('active');renderFilters();renderFeed();showNotification(filtroAtivo?'Filtrando: '+PROMO_CONFIG[tipo].label:'Filtro removido')}
    document.getElementById('btn-filter-flash').addEventListener('click',function(){ativarFiltroSidebar('flash')});
    document.getElementById('btn-filter-cupom').addEventListener('click',function(){ativarFiltroSidebar('cupom')});
    document.getElementById('btn-filter-frete').addEventListener('click',function(){ativarFiltroSidebar('frete_gratis')});
    document.getElementById('btn-filter-cashback').addEventListener('click',function(){ativarFiltroSidebar('cashback')});

    document.getElementById('btn-refresh-feed').addEventListener('click',function(){var icon=this.querySelector('i');icon.style.transition='transform 0.5s ease';icon.style.transform='rotate(360deg)';setTimeout(function(){icon.style.transform=''},600);filtroAtivo=null;document.getElementById('search-query').value='';iconCache={};preTestarTodosIcones();renderFilters();renderCurrentTab();showNotification('Ofertas atualizadas')});
    document.getElementById('btn-demo-alert').addEventListener('click',dispararAlertaAleatorio);

    document.getElementById('btn-demo-auto').addEventListener('click',function(){if(demoInterval){clearInterval(demoInterval);demoInterval=null;this.classList.remove('active-demo');this.textContent='Auto Demo';showNotification('Demo desativado')}else{this.classList.add('active-demo');this.textContent='Parar Demo';showNotification('Demo automatico — alertas a cada 5s');demoInterval=setInterval(dispararAlertaAleatorio,5000)}});

    document.getElementById('fab-add').addEventListener('click',function(){if(tabAtiva!=='monitored'){tabAtiva='monitored';document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});document.querySelector('[data-tab="monitored"]').classList.add('active');renderMonitored()}document.getElementById('modal-add-product').classList.add('active')});
    document.getElementById('btn-modal-cancel').addEventListener('click',function(){document.getElementById('modal-add-product').classList.remove('active')});
    document.getElementById('btn-modal-confirm').addEventListener('click',function(){var name=document.getElementById('input-prod-name').value.trim();var target=parseFloat(document.getElementById('input-prod-target').value);if(name.length<2){showNotification('Digite o nome do produto');return}if(!target||target<=0){showNotification('Digite um preco alvo valido');return}var current=Math.round(target*(1.15+Math.random()*0.25));monitoredProducts.push({name:name,targetPrice:target,currentPrice:current});document.getElementById('modal-add-product').classList.remove('active');document.getElementById('input-prod-name').value='';document.getElementById('input-prod-target').value='';atualizarBadgeMonitorados();renderMonitored();showNotification('Produto adicionado!');dispararAlertaPromocaoIA('Monitorando: '+name+' — Alvo R$ '+target.toLocaleString('pt-BR'),'fidelidade')});
    document.getElementById('btn-compare-close').addEventListener('click',function(){document.getElementById('modal-compare').classList.remove('active')});
    document.querySelectorAll('.modal-overlay').forEach(function(overlay){overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.classList.remove('active')})});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.querySelectorAll('.modal-overlay.active').forEach(function(m){m.classList.remove('active')});if(searchActive){searchActive=false;document.getElementById('search-bar').classList.remove('active')}esconderAlertaVisual()}});

    setInterval(function(){if(monitoredProducts.length>0){var idx=Math.floor(Math.random()*monitoredProducts.length);var prod=monitoredProducts[idx];var change=(Math.random()-0.6)*prod.targetPrice*0.05;prod.currentPrice=Math.max(Math.round(prod.targetPrice*0.8),Math.round(prod.currentPrice+change));if(prod.currentPrice<=prod.targetPrice)dispararAlertaPromocaoIA(prod.name+' atingiu seu preco alvo! R$ '+prod.currentPrice.toLocaleString('pt-BR'),'desconto');if(tabAtiva==='monitored')renderMonitored()}},8000);

    // ===================================================================
    // AUTO-REFRESH: busca novas promocoes do Neon a cada 30s
    // ===================================================================
    autoRefreshInterval=setInterval(function(){if(tabAtiva==='feed')renderFeed()},30000);

    // ===================================================================
    // EXEMPLO DE USO: buscar programas e transacoes
    // ===================================================================
    async function exemploUso() {
      try {
        // Buscar programas da Awin via /programas
        const programas = await fetch('/programas').then(r => r.json());
        console.log('📦 Programas da Awin:', programas);

        // Buscar transações via /transacoes
        const transacoes = await fetch('/transacoes').then(r => r.json());
        console.log('💰 Transações:', transacoes);
      } catch (err) {
        console.warn('Erro ao buscar dados:', err);
      }
    }
    // Executar exemplo após carregar
    setTimeout(exemploUso, 3000);
  }

  window.onload=initApp;
</script>
</body>
</html>
