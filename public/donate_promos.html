<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Promo - Apoie o Projeto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{--bg-color:#0c0e12;--panel-color:#14171e;--card-color:#1a1e27;--accent-color:#FFB300;--accent-glow:rgba(255,179,0,0.15);--alert-color:#ff3333;--text-main:#f0f0f0;--text-muted:#7a7f8a;--sidebar-width:64px;--btn-size:48px;--radius-sm:8px;--radius-md:12px;--radius-lg:18px;--radius-full:50px}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',sans-serif;background-color:var(--bg-color);color:var(--text-main);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        
        /* Header */
        header{background:linear-gradient(135deg,var(--panel-color) 0%,#1c2030 100%);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--accent-color);box-shadow:0 4px 20px rgba(255,179,0,0.12);z-index:1000;flex-shrink:0}
        .header-left{display:flex;align-items:center;gap:10px}
        
        .app-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#FFB300,#FF8F00);display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:900; overflow:hidden; padding: 4px;}
        .app-icon img{width: 100%; height: 100%; object-fit: contain; display: block;}
        
        h1{font-size:1.15rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
        h1 span{color:var(--accent-color);text-shadow:0 0 20px rgba(255,179,0,0.3)}
        .header-right{display:flex;align-items:center;gap:10px}
        .savings-badge{display:flex;align-items:center;gap:6px;background:rgba(255,179,0,0.1);border:1px solid rgba(255,179,0,0.3);border-radius:var(--radius-full);padding:6px 12px;font-size:0.75rem;font-weight:700;color:var(--accent-color)}
        .savings-badge i{font-size:0.85rem}

        /* Container do Iframe */
        .iframe-container{flex:1;position:relative;background-color:#1a1e27;margin:16px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid rgba(255,255,255,0.05);box-shadow:0 8px 30px rgba(0,0,0,0.4);display:flex;flex-direction:column;}
        
        .iframe-header{background:var(--panel-color);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0;}
        .iframe-header i{color:var(--accent-color);font-size:1rem;}
        .iframe-header span{font-size:0.8rem;color:var(--text-muted);font-weight:600;}

        /* O iframe em si */
        .iframe-content{flex:1;width:100%;border:none;background:#ffffff;}
        
        /* Caso o iframe seja bloqueado pelo PayPal, mostramos um aviso */
        .iframe-fallback{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 40px 20px;}
        .iframe-fallback i{font-size:3rem;color:var(--accent-color);margin-bottom:20px;opacity:0.6;}
        .iframe-fallback h2{font-size:1.2rem;color:var(--text-main);margin-bottom:10px;}
        .iframe-fallback p{font-size:0.9rem;color:var(--text-muted);margin-bottom:24px;max-width:400px;line-height:1.5;}
        .btn-external{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:var(--radius-full);border:none;background:linear-gradient(135deg,#FFB300,#FF8F00);color:#000;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.2s;box-shadow: 0 4px 15px rgba(255,179,0,0.3);text-decoration:none;}
        .btn-external:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,179,0,0.5);filter:brightness(1.1);}

        @media(max-width:380px){h1{font-size:1rem}.savings-badge{display:none}}
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="app-icon">
                <img src="./imagens_app/ic_icon_app.png" alt="MAX PROMO">
            </div>
            <h1>MAX <span>PROMO</span></h1>
        </div>
        <div class="header-right">
            <div class="savings-badge">
                <i class="fas fa-heart" style="color: #ff4444;"></i>
                Apoie o Projeto
            </div>
        </div>
    </header>

    <div class="iframe-container">
        <!-- Cabeçalho simulando uma aba de navegador -->
        <div class="iframe-header">
            <i class="fas fa-lock"></i>
            <span>secure.paypal.com</span>
        </div>
        
        <!-- Tenta carregar o PayPal dentro da página -->
        <iframe src="https://www.paypal.com/donate/?hosted_button_id=VVRPXE4C2JYUE" class="iframe-content" id="paypal-iframe" title="Doação PayPal"></iframe>

        <!-- Se o PayPal bloquear o iframe, esta mensagem e o botão aparecem automaticamente -->
        <div class="iframe-fallback" id="fallback-message">
            <i class="fas fa-shield-halved"></i>
            <h2>Rede Segura do PayPal</h2>
            <p>Por motivos de segurança bancária, o PayPal precisa abrir em uma nova aba para concluir a sua doação com total proteção.</p>
            <a href="https://www.paypal.com/donate/?hosted_button_id=VVRPXE4C2JYUE" target="_blank" class="btn-external">
                <i class="fas fa-external-link-alt"></i>
                Ir para o PayPal
            </a>
        </div>
    </div>

    <!-- Script que detecta se o PayPal bloqueou o Iframe e exibe o botão de fallback -->
    <script>
        const iframe = document.getElementById('paypal-iframe');
        const fallback = document.getElementById('fallback-message');
        
        // Tentativa de detectar bloqueio do iframe (CORS)
        try {
            // Se conseguirmos acessar o conteúdo, significa que carregou
            iframe.onload = function() {
                // O PayPal costuma redirecionar para a mesma URL com parâmetros extras se bloquear
                if(iframe.contentWindow.length === 0) {
                    showFallback();
                }
            };
        } catch (e) {
            showFallback();
        }

        // Timer de segurança: se após 5 segundos o iframe continuar vazio, mostra o botão
        setTimeout(() => {
            // Se o iframe não carregou nada visível
            try {
                // Força a verificação
                if(!iframe.contentDocument || !iframe.contentDocument.body || iframe.contentDocument.body.innerHTML === "") {
                    showFallback();
                }
            } catch (error) {
                // Se der erro de permissão ao tentar ler, o bloqueio ocorreu
                showFallback();
            }
        }, 4000); // 4 segundos

        function showFallback() {
            iframe.style.display = 'none';
            fallback.style.display = 'flex';
        }
    </script>

</body>
</html>
